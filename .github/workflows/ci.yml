name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Verify compatibility matrix
        run: go run ./cmd/ulab test --jobs 2 --config examples/stateful-upgrade/ulab.json --json-out /tmp/ulab-good.json
      - name: Verify broken matrix is detected
        shell: bash
        run: |
          if go run ./cmd/ulab test --jobs 2 --config examples/stateful-upgrade/ulab-broken.json --json-out /tmp/ulab-broken.json; then
            echo "broken matrix unexpectedly passed"
            exit 1
          fi
          grep -q '"status": "failed"' /tmp/ulab-broken.json
