services:
  server:
    image: docker.gitea.com/gitea:${GITEA_IMAGE_TAG:-1.27.3}
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: localhost
      GITEA__server__ROOT_URL: http://localhost:3300/
      GITEA__actions__ENABLED: "false"
    volumes:
      - gitea-data:/data
    ports:
      - "127.0.0.1:3300:3000"

volumes:
  gitea-data:
