services:
  source:
    image: postgres:${ULAB_SOURCE_VERSION:-16.15}
    environment:
      POSTGRES_PASSWORD: ulab-test
      POSTGRES_DB: ulab
    volumes:
      - source-data:/var/lib/postgresql/data
      - transfer:/transfer

  target:
    image: postgres:${ULAB_TARGET_VERSION:-18.6}
    environment:
      POSTGRES_PASSWORD: ulab-test
      POSTGRES_DB: ulab
    volumes:
      - target-data:/var/lib/postgresql
      - transfer:/transfer

volumes:
  source-data:
  target-data:
  transfer:
